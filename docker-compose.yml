# Local dev stack for Chassix AI (ADR-D5 Postgres, ADR-D6 S3-compatible storage).
# Start with: pnpm dev:stack   (docker compose up -d)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chassix
      POSTGRES_PASSWORD: chassix
      POSTGRES_DB: chassix
    ports:
      - "5432:5432"
    volumes:
      - chassix_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chassix"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chassix
      MINIO_ROOT_PASSWORD: chassix-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - chassix_storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chassix_db:
  chassix_storage:
